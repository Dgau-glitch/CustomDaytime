"minecraft:overworld" {
    # Length of the daytime cycle in minutes
    # Default: 10.0
    dayLength=10.0

    # Length of the nighttime cycle in minutes
    # Default: 10.0
    nightLength=10.0

    # Enable or disable night acceleration when enough players sleep
    # False: use vanilla sleep-to-skip-night mechanic
    # Default: true
    accelerationEnabled=true

    # Required sleeping player percentage to start smooth night acceleration
    # Spectators, operators, and players tagged afk/vanish/vanished are not counted.
    # Default: 50
    playersSleepingPercentage=50

    # Additional acceleration scale when 100% of players sleep
    # 1.0 keeps the built-in vanilla-like speed; 0.5 halves it; 2.0 doubles it.
    # Default: 1.0
    fullSleepAccelerationMultiplier=1.0

    # Show a bossbar with sleep progress to all players in the world
    # Available placeholders: {sleeping}, {total}, {required}, {threshold}, {percentage}, {world}
    # Default: true
    sleepBossBarEnabled=true

    # Bossbar message shown while at least one counted player is sleeping
    # Default: "&bSleeping: &f{sleeping}/{required} &7({percentage}%)"
    sleepBossBarMessage="&bSleeping: &f{sleeping}/{required} &7({percentage}%)"

    # Bossbar color: PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    # Default: BLUE
    sleepBossBarColor="BLUE"

    # Bossbar overlay: PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
    # Default: PROGRESS
    sleepBossBarOverlay="PROGRESS"
}
