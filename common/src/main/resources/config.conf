"minecraft:overworld" {
    # Length of the daytime cycle in minutes
    # Default: 10.0
    dayLength=10.0

    # Length of the nighttime cycle in minutes
    # Default: 10.0
    nightLength=10.0

    # Enable or disable night acceleration when enough players sleep
    # False: use vanilla sleep-to-skip-night mechanic
    # Default: true
    accelerationEnabled=true

    # Required sleeping player percentage to start smooth night acceleration
    # Default: 50
    playersSleepingPercentage=50

    # Additional acceleration scale when 100% of players sleep
    # 1.0 keeps the built-in vanilla-like speed; 0.5 halves it; 2.0 doubles it.
    # Default: 1.0
    fullSleepAccelerationMultiplier=1.0
}
