"minecraft:overworld" {
    # Length of the daytime cycle in minutes
    # Default: 10.0
    dayLength=10.0

    # Length of the nighttime cycle in minutes
    # Default: 10.0
    nightLength=10.0

    # Enable or disable night acceleration when enough players sleep
    # False: use vanilla sleep-to-skip-night mechanic
    # Default: true
    accelerationEnabled=true

    # Night acceleration multiplier when 100% of players sleep
    # The plugin scales this value by sleeping player percentage: 50% sleeping with 300.0 gives 150x.
    # Default: 300.0
    fullSleepAccelerationMultiplier=300.0
}
